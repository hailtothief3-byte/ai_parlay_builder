services:
  - type: web
    name: empire-life
    env: python
    plan: starter
    rootDir: empire_life
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
